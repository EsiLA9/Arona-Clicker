<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Infinite Board 原型</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="viewport" class="viewport" aria-label="无限图板">
      <div id="world" class="world">
        <svg id="edges" class="edges" aria-label="连接"></svg>
        <div id="nodes" class="nodes"></div>
      </div>
      <div class="toolbar" aria-label="图板文件操作">
        <button type="button" data-action="export">导出 JSON</button>
        <button type="button" data-action="import">导入 JSON</button>
        <button type="button" data-action="clear" class="danger">清空</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden />
      </div>
      <div id="zoom" class="zoom-control">
        <button type="button" title="恢复到 100%" aria-label="恢复到 100%">100%</button>
      </div>
      <details class="type-guide">
        <summary>类型关系示例</summary>
        <p><strong>数据源</strong> 的「数据」输出只能连接到 <strong>处理节点</strong> 的「数据」输入。</p>
        <p><strong>处理节点</strong> 的「结果」输出只能连接到 <strong>结果节点</strong> 的「结果」输入。</p>
        <p>拖动连接点时，绿色标记表示可连接目标；节点的视觉样式与连接类型彼此独立。</p>
      </details>
      <p id="status" class="status" role="status" aria-live="polite">左键空白处拖选 · 中键拖动平移（也可加按左键）· 右键添加</p>
      <div id="popup" class="popup-root"></div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
