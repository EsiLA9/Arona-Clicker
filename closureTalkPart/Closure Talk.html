                .action-loading-overlay {

                    top: 20px;
                    left: 50%;
                    transform: translateX(-50%);
                    z-index: 2147483647;
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                }

                .loading-container {
                    background: #487c54;
                    color: white;
                    padding: 12px 24px;
                    border-radius: 50px;
                    box-shadow: 0 4px 20px rgba(144, 169, 148, 0.4);
                    font-size: 14px;
                    min-width: 100px;
                }

                .loading-content {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    gap: 10px;
                }

                .loading-spinner {
                    width: 16px;
                    height: 16px;
                    border: 2px solid rgba(255, 255, 255, 0.3);
                    border-top: 2px solid #ffffff;
                    border-radius: 50%;
                    animation: spin 0.8s linear infinite;
                    flex-shrink: 0;
                }

                .loading-text {
                    white-space: nowrap;
                    font-weight: 500;
                    letter-spacing: 0.5px;
                }

                @keyframes spin {
                    0% {
                        transform: rotate(0deg);
                    }

                    100% {
                        transform: rotate(360deg);
                    }
                }

                /* Transition 动画：从顶部往下滑出 */
                .loading-enter-active,
                .loading-leave-active {
                    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
                }

                .loading-enter-from {
                    opacity: 0;
                    transform: translateX(-50%) translateY(-30px);
                }

                .loading-leave-to {
                    opacity: 0;
                    transform: translateX(-50%) translateY(-30px);
                }

                .loading-enter-to,
                .loading-leave-from {
                    opacity: 1;
                    transform: translateX(-50%) translateY(0);
                }
