<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AronaClickerPM — 游戏测试界面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 14px/1.5 system-ui, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
  h1 { font-size: 20px; margin-bottom: 12px; color: #58a6ff; }
  h2 { font-size: 15px; margin-bottom: 8px; color: #8b949e; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .col { flex: 1; min-width: 280px; }
  .panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  .stat { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #21262d; }
  .stat:last-child { border: none; }
  .label { color: #8b949e; }
  .value { font-weight: 600; font-variant-numeric: tabular-nums; }
  .value.gold { color: #f0c040; }
  .value.crystal { color: #a371f7; }
  .value.mithril { color: #3fb950; }
  button { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button:hover { background: #30363d; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  button.primary:hover { background: #388bfd; }
  button.danger { background: #da3633; border-color: #da3633; color: #fff; }
  button.danger:hover { background: #f85149; }
  .toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #21262d; }
  .item:last-child { border: none; }
  .item .name { font-weight: 600; }
  .item .desc { color: #8b949e; font-size: 12px; }
  .log { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 8px; height: 200px; overflow-y: auto; font: 12px/1.6 monospace; }
  .log div { padding: 1px 0; }
  .log .tick { color: #58a6ff; }
  .log .gain { color: #3fb950; }
  .log .spend { color: #f85149; }
  .log .info { color: #8b949e; }
  .log .discover { color: #f0c040; }
  .flex-between { display: flex; justify-content: space-between; align-items: center; }
  .badge { display: inline-block; background: #21262d; padding: 0 6px; border-radius: 10px; font-size: 11px; color: #8b949e; }
</style>
</head>
<body>

<h1>🧪 AronaClickerPM — 游戏测试界面 <span style="font-size:12px;color:#8b949e;">(引擎驱动)</span></h1>

<div class="row">
  <div class="col">
    <div class="panel">
      <div class="flex-between"><h2>📊 游戏状态</h2><span id="tickDisplay" class="badge">🥚 初始</span></div>
      <div id="resources"></div>
    </div>
    <div class="panel">
      <h2>📍 位置</h2>
      <div id="location"></div>
    </div>
    <div class="panel">
      <h2>🎮 操作</h2>
      <div class="toolbar">
        <button class="primary" id="btnTick1">⏩ Tick ×1</button>
        <button class="primary" id="btnTick5">⏩ Tick ×5</button>
        <button class="primary" id="btnTick20">⏩ Tick ×20</button>
        <button class="primary" id="btnTick100">⏩ Tick ×100</button>
      </div>
      <div class="toolbar">
        <button id="btnReset">🔄 重置</button>
        <button id="btnInit">🏁 进入 Init</button>
      </div>
    </div>
  </div>

  <div class="col">
    <div class="panel">
      <h2>⛏️ 拥有的 Spot</h2>
      <div id="spots"></div>
    </div>
    <div class="panel">
      <h2>🌍 地区</h2>
      <div id="areas"></div>
    </div>
  </div>

  <div class="col">
    <div class="panel">
      <h2>🏪 商店</h2>
      <div id="shop"></div>
    </div>
    <div class="panel">
      <h2>📜 事件日志</h2>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<script type="module" src="./main.ts"></script>
</body>
</html>
